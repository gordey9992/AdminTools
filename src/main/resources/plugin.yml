name: AdminTools
version: 1.0.0
main: com.yourname.admintools.AdminTools
api-version: "1.21.8"
author: YourName
description: Продвинутые админ-инструменты с частицами, модерацией и никами

commands:
  particles:
    description: Система эффектов частиц
    usage: /particles <тип|список|стоп>
    aliases: [particle, эффекты]
  vanish:
    description: Режим невидимки
    usage: /vanish
    aliases: [v, невидимка]
  nick:
    description: Изменить никнейм
    usage: /nick <ник> [цвет]
    aliases: [ник, имя]
  invsee:
    description: Просмотр инвентаря игрока
    usage: /invsee <игрок>
    aliases: [инвентарь, инв]
  whois:
    description: Информация об игроке
    usage: /whois <игрок>
    aliases: [игрок, инфо]
  admin:
    description: Основная команда админа
    usage: /admin <полет|лечение|бессмертие|еда|починка>
    aliases: [а, админ]

permissions:
  admintools.*:
    description: Все разрешения AdminTools
    children:
      admintools.particles: true
      admintools.vanish: true
      admintools.nick: true
      admintools.invsee: true
      admintools.whois: true
      admintools.admin: true
      admintools.seevanished: true
  admintools.particles:
    description: Доступ к эффектам частиц
    default: op
  admintools.vanish:
    description: Доступ к режиму невидимки
    default: op
  admintools.nick:
    description: Изменение никнейма
    default: op
  admintools.invsee:
    description: Просмотр инвентаря других игроков
    default: op
  admintools.whois:
    description: Получение информации об игроках
    default: op
  admintools.admin:
    description: Административные команды
    default: op
  admintools.seevanished:
    description: Видеть невидимых игроков
    default: op
